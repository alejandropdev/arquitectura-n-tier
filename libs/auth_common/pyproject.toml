[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-common"
version = "0.1.0"
description = "Libreria de autenticacion reutilizable (Taller 2, Requerimiento 9): decodificacion/validacion de JWT y dependencias de autorizacion para FastAPI."
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
