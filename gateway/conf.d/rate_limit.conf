# Taller 2 — Requerimiento 10 (rate limiting). Archivo de Alejandro.
#
# Separado de nginx.conf (donde vive el balanceo de carga de Carlos) por
# acuerdo del kickoff: cada quien edita sus propios bloques/include para no
# chocar al fusionar ramas. Este archivo solo declara las zonas — el uso
# (`limit_req zone=...;`) va en las `location` de nginx.conf.
#
# - req_by_ip:    protege contra ráfagas de un mismo cliente (login, etc.),
#                 clave = IP de origen.
# - req_by_token: protege el uso de la API ya autenticada, clave = `sub` del
#                 JWT (la resuelve auth_request.conf vía /_internal/introspect).
#                 Si $auth_sub está vacío (petición sin auth_request), nginx
#                 simplemente no aplica esta dimensión — es el comportamiento
#                 esperado, no un error.
limit_req_zone $binary_remote_addr zone=req_by_ip:10m    rate=10r/s;
limit_req_zone $auth_sub           zone=req_by_token:10m rate=5r/s;

limit_req_status 429;
limit_req_log_level warn;
