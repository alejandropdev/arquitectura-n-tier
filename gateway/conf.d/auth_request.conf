# Taller 2 — Requerimiento 9(a) (validación de token antes de enrutar).
# Archivo de Alejandro; ver nota de separación en rate_limit.conf.
#
# Subrequest interna hacia el endpoint barato de auth-service
# (GET /api/v1/auth/introspect: solo firma/iss/exp/aud, sin ir a la base de
# datos) — nginx no puede validar un JWT por sí mismo (imagen nginx:alpine
# simple, sin njs/Lua). Nunca se expone al exterior (`internal;`).
location = /_internal/introspect {
    internal;
    proxy_pass http://auth_tier/api/v1/auth/introspect;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
}
