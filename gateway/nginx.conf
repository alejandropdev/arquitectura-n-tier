worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json_logs escape=json
        '{"timestamp":"$time_iso8601","service":"gateway","tier":"balanceador",'
        '"actor":"$http_x_actor","client_ip":"$remote_addr",'
        '"action":"$request_method $uri","outcome":"$status",'
        '"request_id":"$http_x_request_id","upstream":"$upstream_addr",'
        '"duration_ms":"$request_time","bytes":"$body_bytes_sent"}';

    access_log /dev/stdout json_logs;
    error_log  /dev/stderr warn;

    # Falla rápido: no dejamos peticiones colgadas contra una instancia caída.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    # Recuperación de fallas: si una instancia falla, se reintenta en la siguiente.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $http_x_request_id;

    # Alejandro: zonas de rate limiting (Req. 10) — bloques/include
    # separados del balanceo de carga de Carlos (acordado en el kickoff).
    # Ver gateway/conf.d/. (El include de auth_request.conf va dentro del
    # server{} de abajo: una `location` no es válida a este nivel.)
    include /etc/nginx/conf.d/rate_limit.conf;

    # --- Redundancia activa: dos instancias por tier ---
    # max_fails/fail_timeout = detección pasiva de fallas: tras 2 errores la
    # instancia sale de rotación durante 10 s.
    upstream web_tier {
        server web-1:8000 max_fails=2 fail_timeout=10s;
        server web-2:8000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    upstream auth_tier {
        server auth-service-1:8000 max_fails=2 fail_timeout=10s;
        server auth-service-2:8000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    upstream products_tier {
        server products-service-1:3000 max_fails=2 fail_timeout=10s;
        server products-service-2:3000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # Tier 1 — entrada de los usuarios
    server {
        listen 8080;

        location / {
            limit_req zone=req_by_ip burst=20 nodelay;   # Alejandro: Req. 10
            proxy_pass http://web_tier;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /gateway/health {
            access_log off;
            return 200 '{"status":"alive","service":"gateway"}';
            add_header Content-Type application/json;
        }
    }

    # Tier 2 — solo accesible desde la red interna del despliegue
    server {
        listen 8081;

        # Alejandro: Req. 9a — define /_internal/introspect (subrequest
        # interna, ver gateway/conf.d/auth_request.conf).
        include /etc/nginx/conf.d/auth_request.conf;

        # Alejandro: Req. 9a — rutas protegidas exigen un token válido
        # (firma/iss/exp/aud) antes de enrutar al Tier 2. Hoy solo
        # /api/v1/users/*; /api/v1/products/* se agrega igual cuando exista
        # ese upstream (products-service).
        location /api/v1/users/ {
            auth_request /_internal/introspect;
            auth_request_set $auth_sub $upstream_http_x_user_id;

            limit_req zone=req_by_ip burst=20 nodelay;      # Alejandro: Req. 10
            limit_req zone=req_by_token burst=10 nodelay;   # Alejandro: Req. 10

            proxy_pass http://auth_tier;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---- products-service ----
        # Sin auth_request por ahora: el Tier 1 (web) todavía no reenvía el
        # Authorization Bearer del usuario en ProductsClient, solo X-Actor.
        location ~ ^/api/v1/(products|categories)(/|$) {
            proxy_pass http://products_tier$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /products/health {
            proxy_pass http://products_tier/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Rutas públicas: registro/login/verify/introspect son el propio
        # mecanismo de auth y no se gatean con auth_request; /health y
        # /metrics deben quedar siempre abiertos (sondas, Prometheus).
        location / {
            limit_req zone=req_by_ip burst=20 nodelay;   # Alejandro: Req. 10
            proxy_pass http://auth_tier;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
