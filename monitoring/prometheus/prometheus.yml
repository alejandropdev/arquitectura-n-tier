global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: web
    static_configs:
      - targets: ["web-1:8000", "web-2:8000"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service-1:8000", "auth-service-2:8000"]
