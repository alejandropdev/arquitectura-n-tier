{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block heading %}Crear cuenta{% endblock %}
{% block subtitle %}Mínimo 8 caracteres, con mayúscula, minúscula y un dígito{% endblock %}

{% block content %}
<form method="post" action="/register" novalidate>
  <label for="username">Usuario</label>
  <input id="username" name="username" type="text" value="{{ username|default('') }}"
         autocomplete="username" required minlength="3" maxlength="32">

  <label for="email">Correo electrónico</label>
  <input id="email" name="email" type="email" value="{{ email|default('') }}"
         autocomplete="email" required>

  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="new-password"
         required minlength="8">

  <label for="password_confirm">Confirmar contraseña</label>
  <input id="password_confirm" name="password_confirm" type="password"
         autocomplete="new-password" required minlength="8">

  <button type="submit">Registrarme</button>
</form>

<p class="muted">¿Ya tiene cuenta? <a href="/login">Inicie sesión</a></p>
{% endblock %}
