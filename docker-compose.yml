# Despliegue del taller: arquitectura de 3 tiers con redundancia activa.
#
#            :8080                    :8081 (interno)
#   navegador ──► gateway (nginx) ──► web-1 / web-2 ──► gateway ──► auth-service-1 / -2 ──► postgres
#
# Solo el gateway publica puertos; la base de datos nunca se expone al host.

name: taller2-products

x-auth-env: &auth-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER_AUTH:-auth}:${POSTGRES_PASSWORD_AUTH:-auth}@auth-db:5432/${POSTGRES_DB_AUTH:-authdb}
  JWT_SECRET: ${JWT_SECRET:-cambiame-en-produccion}
  JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-auth-service}
  JWT_AUDIENCES: ${JWT_AUDIENCES:-auth-service,products-service}
  MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS:-5}
  LOCKOUT_SECONDS: ${LOCKOUT_SECONDS:-300}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-web-env: &web-env
  AUTH_SERVICE_URL: http://gateway:8081
  AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-3}
  PRODUCTS_SERVICE_URL: http://gateway:8081
  PRODUCTS_TIMEOUT_SECONDS: ${PRODUCTS_TIMEOUT_SECONDS:-3}
  RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-3}
  BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
  BREAKER_RECOVERY_SECONDS: ${BREAKER_RECOVERY_SECONDS:-15}
  # Mismo secreto/algoritmo/emisor que auth-service (Taller 2, Requerimiento
  # 9): web decodifica localmente solo para leer `role`, ver
  # web/app/controllers/dependencies.py.
  JWT_SECRET: ${JWT_SECRET:-cambiame-en-produccion}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-auth-service}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# `env.config.ts` de products-service lee variables discretas (DB_HOST, DB_USERNAME, ...),
# no una URL de conexión: por eso este ancla no usa DATABASE_URL como la de auth.
x-products-env: &products-env
  DB_HOST: products-db
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER_PRODUCTS:-products}
  DB_PASSWORD: ${POSTGRES_PASSWORD_PRODUCTS:-products}
  DB_NAME: ${POSTGRES_DB_PRODUCTS:-productsdb}
  API_PREFIX: api/v1
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:

  # ---------------- TIER 3: datos (auth-service) ----------------
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_AUTH:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH:-auth}
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-authdb}
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_AUTH:-auth} -d ${POSTGRES_DB_AUTH:-authdb}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [appnet]

  # ---------------- TIER 2: lógica de negocio (auth — redundancia activa) ----------------
  auth-service-1:
    # context: raíz del repo (no ./auth-service) para poder instalar la
    # librería compartida libs/auth_common (Taller 2, Requerimiento 9) — ver
    # auth-service/Dockerfile.
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *auth-env
      INSTANCE_ID: auth-service-1
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [appnet]

  auth-service-2:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *auth-env
      INSTANCE_ID: auth-service-2
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [appnet]

  # ---------------- TIER 3: datos (products-service) ----------------
  products-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_PRODUCTS:-products}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PRODUCTS:-products}
      POSTGRES_DB: ${POSTGRES_DB_PRODUCTS:-productsdb}
    volumes:
      - products-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_PRODUCTS:-products} -d ${POSTGRES_DB_PRODUCTS:-productsdb}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [appnet]

  # `synchronize` está en `false` a propósito (data-source.ts): el esquema solo
  # cambia por migraciones versionadas. Este job corre una vez, antes que las
  # instancias de la app, para no correr `migration:run` dos veces en paralelo.
  products-service-migrate:
    build: ./products-service
    environment:
      <<: *products-env
    entrypoint: ["node"]
    command: ["node_modules/typeorm/cli.js", "migration:run", "-d", "dist/infrastructure/db/data-source.js"]
    depends_on:
      products-db:
        condition: service_healthy
    restart: "no"
    networks: [appnet]

  # ---------------- TIER 2: lógica de negocio (products — redundancia activa) ----------------
  products-service-1:
    build: ./products-service
    environment:
      <<: *products-env
      INSTANCE_ID: products-service-1
    depends_on:
      products-db:
        condition: service_healthy
      products-service-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [appnet]

  products-service-2:
    build: ./products-service
    environment:
      <<: *products-env
      INSTANCE_ID: products-service-2
    depends_on:
      products-db:
        condition: service_healthy
      products-service-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [appnet]

  # ---------------- TIER 1: presentación (redundancia activa) ----------------
  web-1:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      <<: *web-env
      INSTANCE_ID: web-1
    restart: unless-stopped
    networks: [appnet]

  web-2:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      <<: *web-env
      INSTANCE_ID: web-2
    restart: unless-stopped
    networks: [appnet]

  # ---------------- Balanceador ----------------
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"   # entrada de usuarios (Tier 1)
      - "8081:8081"   # API del Tier 2 (expuesta solo para pruebas del taller)
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      # Rate limiting + validación de token antes de enrutar (Taller 2,
      # Requerimiento 9a/10) — bloques separados del nginx.conf de Carlos,
      # ver gateway/conf.d/.
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
    # nginx resuelve los nombres de los upstreams al arrancar: los contenedores
    # deben existir antes que él.
    depends_on: [web-1, web-2, auth-service-1, auth-service-2, products-service-1, products-service-2]
    healthcheck:
      # 127.0.0.1 y no `localhost`: en esta imagen `localhost` resuelve a ::1 y
      # nginx escucha en IPv4, así que la sonda se conectaría al sitio equivocado.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [appnet]

  # ---------------- Observabilidad ----------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [appnet]

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    environment:
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
    # El .template no admite variables de entorno directamente; se sustituyen
    # con sed antes de arrancar y el resultado se escribe en /tmp (writable).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s#__SMTP_USER__#$$SMTP_USER#g" \
            -e "s#__SMTP_PASSWORD__#$$SMTP_PASSWORD#g" \
            -e "s#__ALERT_EMAIL_TO__#$$ALERT_EMAIL_TO#g" \
            /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    restart: unless-stopped
    networks: [appnet]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [appnet]

  # ---------------- Administración de base de datos ----------------
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on: [products-db]
    restart: unless-stopped
    networks: [appnet]

volumes:
  auth-pgdata:
  products-pgdata:
  prometheus-data:
  grafana-data:
  pgadmin-data:

networks:
  appnet:
    driver: bridge
